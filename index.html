<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 零代码小游戏 · 两个作品</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 15% 0%, #1e1b4b, #020617 60%);
    color: #e2e8f0; font-family: "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { width: min(920px, 92vw); padding: 40px 0; }
  h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: 4px; text-align: center; }
  .sub { margin: 0 0 34px; color: #94a3b8; text-align: center; font-size: 14px; letter-spacing: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .card {
    display: block; text-decoration: none; color: inherit; padding: 26px;
    border-radius: 18px; background: linear-gradient(160deg, rgba(30,41,59,.95), rgba(15,23,42,.95));
    border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,.35);
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: #38bdf8; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; margin-bottom: 14px; }
  .tag.blue { background: rgba(56,189,248,.14); color: #7dd3fc; }
  .tag.green { background: rgba(52,211,153,.14); color: #6ee7b7; }
  h2 { margin: 0 0 8px; font-size: 23px; }
  p { margin: 0; color: #94a3b8; font-size: 14px; line-height: 1.8; }
  .go { margin-top: 18px; color: #38bdf8; font-size: 14px; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI 零代码小游戏</h1>
  <p class="sub">两个用 AI 辅助完成的小作品 · 点击卡片开始玩</p>
  <div class="grid">
    <a class="card" href="./sokoban/">
      <span class="tag blue">益智 · 经典</span>
      <h2>推箱子 · 经典仓库番</h2>
      <p>方向键或 WASD 移动，把两个箱子推到金色目标点上。支持步数统计、过关判定与一键重开。</p>
      <div class="go">开始游戏 →</div>
    </a>
    <a class="card" href="./snake/">
      <span class="tag green">街机 · 霓虹</span>
      <h2>贪吃蛇 · 霓虹版</h2>
      <p>方向键或 WASD 控制，吃到红色果实得分，撞墙或撞到自己结束。带最高分记录与暂停功能。</p>
      <div class="go">开始游戏 →</div>
    </a>
  </div>
</div>
</body>
</html>
